name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: pip install -r apps/backend/requirements.dev.txt

      - name: Backend tests with coverage
        env:
          SESSION_SECRET: ci-test-session-secret-value
        run: |
          mkdir -p apps/backend/coverage
          PYTHONPATH=apps/backend:. pytest tests/backend \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:apps/backend/coverage \
            --cov-report=xml:apps/backend/coverage/coverage.xml

      - name: Infrastructure tests
        run: pip install PyYAML && pytest tests/infrastructure

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend tests with coverage
        working-directory: apps/frontend
        run: npm ci && npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/backend/coverage
            apps/frontend/coverage
          if-no-files-found: warn
          retention-days: 14
